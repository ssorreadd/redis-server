#redis/.gitlab-ci.yml
stages:
  - build_and_deploy

build_and_deploy:
  stage: build_and_deploy
  image: docker:latest

  script:
    - cp "$REDIS_ENV" "$CI_PROJECT_DIR/.env"
    - cp "$REDIS_ACL" "$CI_PROJECT_DIR/.users.acl"
    - cp "$REDIS_CONF" "$CI_PROJECT_DIR/.redis.conf"

    - apk add --no-cache bash
    - bash ./run.sh
  only:
    - main
  tags:
    - redis
