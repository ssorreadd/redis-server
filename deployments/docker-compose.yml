networks:
  default:

services:
  redis_server:
    image: redis:alpine
    container_name: redis_server
    restart: unless-stopped
    ports:
      - "${REDIS_EXTERNAL_PORT}:${REDIS_PORT}"
    volumes:
      - redis_data:/data
      - ../.redis.conf:/etc/redis/redis.conf
      - ../users.acl:/etc/redis/users.acl:ro
    command: [ "redis-server", "/etc/redis/redis.conf" ]

volumes:
  redis_data: