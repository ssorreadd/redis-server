networks:
  redis_network:
    name: ${REDIS_NAME:-redis_server}_network

volumes:
  redis_data:
    name: ${REDIS_NAME:-redis_server}_data

services:
  redis_server:
    image: redis:8.4-alpine
    container_name: ${REDIS_NAME:-redis_server}
    ports:
      - "${REDIS_HOST_BIND_IP:-127.0.0.1}:${REDIS_EXTERNAL_PORT:-6379}:${REDIS_PORT:-6379}"
    volumes:
      - redis_data:/data
    networks:
      - redis_network
    restart: unless-stopped
    command: [
      "redis-server",
      "--bind", "0.0.0.0",
      "--port", "${REDIS_PORT:-6379}",
      "--appendonly", "yes",
      "--maxmemory", "${REDIS_MAXMEMORY:-256mb}",
      "--maxmemory-policy", "${REDIS_MAXMEMORY_POLICY:-allkeys-lru}",
      "--user", "default", "off", "-@all",
      "--user", "${REDIS_HEALTHCHECK_USERNAME:-healthcheck}", "on", ">${REDIS_HEALTHCHECK_PASSWORD}", "+ping",
      "--user", "${REDIS_USERNAME}", "on", "${REDIS_PASSWORD_TYPE:->}${REDIS_PASSWORD}", "~*", "&*", "+@all"
    ]
    healthcheck:
      test: >-
        redis-cli
        --no-auth-warning
        -h 127.0.0.1
        -p ${REDIS_PORT:-6379}
        --user ${REDIS_HEALTHCHECK_USERNAME:-healthcheck}
        --pass "${REDIS_HEALTHCHECK_PASSWORD}"
        PING
        | grep -qx PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
