name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck run.sh kill.sh

  docker-compose:
    name: Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Validate Docker Compose
        run: docker compose config

      - name: Start Redis
        run: docker compose up -d

      - name: Wait for Redis healthcheck
        run: |
          for i in {1..30}; do
            status=$(docker inspect redis_server --format '{{.State.Health.Status}}')

            if [ "$status" = "healthy" ]; then
              exit 0
            fi

            if [ "$status" = "unhealthy" ]; then
              docker inspect redis_server --format '{{json .State.Health.Log}}' | jq
              exit 1
            fi

            sleep 2
          done

          docker inspect redis_server --format '{{json .State.Health.Log}}' | jq
          exit 1

      - name: Show logs
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v
